name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official Playwright image already has the browsers and their system
    # libraries, so nothing goes through apt (its mirror kept timing out). The
    # tag must match @playwright/test in package-lock.json exactly;
    # src/ciWorkflow.test.ts checks it. Runs as the runner's user, as
    # Playwright's CI guide does, so the workspace stays the runner's. 1001 is
    # the GitHub-hosted runner's uid, not a documented contract: if checkout or
    # npm ci starts failing with EACCES on /__w after a runner image change,
    # check it first.
    # --ipc=host: Chromium can run out of Docker's default 64 MB /dev/shm.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      # The image has Node too, but .nvmrc stays the one source of the version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails fast, with a clear message, if the image tag and the lockfile
      # drifted apart (checks runs the same test in parallel).
      - run: npx vitest run src/ciWorkflow.test.ts
      # playwright.config.ts builds and starts the app itself, against the mock.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
