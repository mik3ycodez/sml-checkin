name: Bug report
description: Something isn't working as it should.
body:
  - type: markdown
    attributes:
      value: |
        Please never include real member names, emails or other personal data in
        an issue. Report security problems privately; see
        [SECURITY.md](https://github.com/mik3ycodez/sml-checkin/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did this happen?
      options:
        - Demo site
        - Running locally
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 13, Safari 17
    validations:
      required: true
